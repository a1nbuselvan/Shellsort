name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS arm64
            runner: macos-15
            target: aarch64-apple-darwin
          - platform: macOS Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - platform: Ubuntu Linux
            runner: ubuntu-24.04
            target: ''
          - platform: Windows
            runner: windows-2025
            target: ''

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust with lint tools
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked

      - name: Build native macOS CLI
        if: runner.os == 'macOS'
        run: cargo build --locked --release --target ${{ matrix.target }} --bin shellsort
